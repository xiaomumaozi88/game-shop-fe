version: '3.8'

services:
  game-shop-fe:
    image: ${DOCKER_REGISTRY:-your-registry.com}/game-shop-fe:latest-test
    container_name: game-shop-fe
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 如果需要自定义 Nginx 配置，取消下面的注释
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录（如果有）
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    networks:
      - game-shop-network

networks:
  game-shop-network:
    driver: bridge

