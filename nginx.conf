server {
    listen 80;
    listen 443 ssl http2;
    server_name pay.paytest.bid;

    # SSL 配置（如果有 SSL 证书）
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # S3 代理配置
    # 注意：如果使用本地文件系统，取消下面的 proxy_pass，改用 root 和 try_files
    # root /path/to/dist;
    # index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # S3 代理目标
    set $s3_bucket "https://s3.ap-southeast-1.amazonaws.com/toukastore/TEST/shop";

    # 静态资源（JS、CSS、图片等）直接代理到 S3
    # 这是关键：必须优先匹配静态资源，确保 JS 文件能正确加载
    location ~* ^/(js|css|assets|imgs|favicon\.png|favicon\.ico)/ {
        proxy_pass $s3_bucket;
        proxy_set_header Host s3.ap-southeast-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓存静态资源
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 根路径特殊处理：直接返回 index.html
    location = / {
        proxy_pass $s3_bucket/index.html;
        proxy_set_header Host s3.ap-southeast-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 所有其他请求（包括 SPA 路由）都返回 index.html
    location / {
        proxy_pass $s3_bucket/index.html;
        proxy_set_header Host s3.ap-southeast-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 设置正确的 Content-Type
        proxy_set_header Accept text/html;
    }

    # 防止访问隐藏文件（可选，增强安全性）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

